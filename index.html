<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English File Elementary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 16px;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 18px;
            margin: 0 0 2px 0;
        }
        
        .header p {
            font-size: 11px;
            opacity: 0.9;
            margin: 0;
        }
        
        .viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f9f9f9;
            overflow: auto;
            position: relative;
            min-height: 0;
        }
        
        .page-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            transition: transform 0.1s ease;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .nav-buttons {
            display: flex;
            gap: 6px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .page-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #333;
            white-space: nowrap;
        }
        
        .page-slider {
            flex: 1;
            min-width: 120px;
            height: 4px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        .page-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        
        .page-slider::-webkit-slider-thumb:hover {
            background: #5568d3;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        
        .page-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        
        .page-slider::-moz-range-thumb:hover {
            background: #5568d3;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        
        .zoom-buttons {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        
        .zoom-display {
            font-size: 10px;
            color: #666;
            min-width: 35px;
            text-align: center;
            font-weight: 500;
        }
        
        .mini-buttons {
            display: flex;
            gap: 3px;
        }
        
        .mini-buttons button {
            padding: 5px 8px;
            font-size: 11px;
        }
        

        /* ===== PESTAÑAS ===== */
        .tabs { display:flex; justify-content:center; gap:6px; margin-top:8px; }
        .tab {
            background: rgba(255,255,255,0.18); color:#fff; padding:6px 16px;
            border-radius:999px; font-size:13px; flex:0 0 auto;
        }
        .tab:hover { background: rgba(255,255,255,0.3); box-shadow:none; }
        .tab.active { background:#fff; color:#5a3e9c; }
        .view { flex:1; display:flex; flex-direction:column; min-height:0; }
        .view[hidden] { display:none; }

        /* ===== EJERCICIOS ===== */
        .ex-wrap { flex:1; overflow-y:auto; background:#f4f3fa; -webkit-overflow-scrolling:touch; }
        .ex-inner { max-width:760px; margin:0 auto; padding:14px 16px 40px; }
        .lessons { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; position:sticky; top:0;
            background:#f4f3fa; padding:8px 0; z-index:2; }
        .lesson-chip { background:#fff; color:#5a3e9c; border:1px solid #d9d2f0; flex:0 0 auto; }
        .lesson-chip:hover { background:#efeafc; box-shadow:none; }
        .lesson-chip.active { background:#667eea; color:#fff; border-color:#667eea; }
        .lesson-chip small { opacity:.75; margin-left:4px; }
        .lesson-title { font-size:17px; color:#333; margin:4px 0 2px; }
        .lesson-sub { font-size:12px; color:#777; margin-bottom:12px; }
        .card { background:#fff; border-radius:10px; padding:14px; margin-bottom:14px;
            box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .card h3 { font-size:15px; color:#5a3e9c; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
        .card .instr { font-size:13px; color:#555; margin:4px 0 10px; }
        .score { font-size:12px; color:#777; font-weight:500; white-space:nowrap; }
        .score.done { color:#2e7d32; }
        .item { padding:8px 0; border-top:1px solid #f0eef6; font-size:15px; color:#222; line-height:1.9; }
        .item:first-of-type { border-top:none; }
        .item .q { margin-right:6px; }
        .opts { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
        .opt { background:#f1effa; color:#333; border:1px solid #ddd6f3; font-size:14px; padding:6px 10px; flex:0 0 auto; }
        .opt:hover { background:#e6e0fa; box-shadow:none; }
        .opt.ok { background:#e3f4e4; border-color:#66bb6a; color:#1b5e20; }
        .opt.bad { background:#fdecea; border-color:#e57373; color:#b71c1c; text-decoration:line-through; }
        .opt:disabled { cursor:default; transform:none; }
        .gap { font-size:15px; padding:3px 6px; border:1px solid #c9c2e6; border-radius:4px;
            min-width:70px; font-family:inherit; }
        .gap:focus { outline:2px solid #667eea; border-color:transparent; }
        .gap.ok { background:#e3f4e4; border-color:#66bb6a; }
        .gap.bad { background:#fdecea; border-color:#e57373; }
        .fix { color:#2e7d32; font-size:13px; margin-left:6px; }
        .say { background:#fff; color:#667eea; border:1px solid #c9c2e6; padding:3px 8px; font-size:14px; margin-right:6px; flex:0 0 auto; }
        .say:hover { background:#efeafc; box-shadow:none; }
        .syl { font-family:inherit; }
        .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
        .actions button { flex:0 0 auto; }
        .actions .sec { background:#fff; color:#667eea; border:1px solid #c9c2e6; }
        .actions .sec:hover { background:#efeafc; box-shadow:none; }
        @media (max-width: 768px) {
            .ex-inner button { flex:0 0 auto; }
            .item { font-size:14px; }
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }
            
            .controls {
                flex-direction: column;
                padding: 8px;
            }
            
            .page-slider {
                width: 100%;
            }
            
            .nav-buttons {
                width: 100%;
                justify-content: center;
            }
            
            button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 English File Elementary</h1>
            <p>5th edition · Multipack B</p>
            <div class="tabs">
                <button class="tab active" id="tabBook" onclick="showTab('libro')">📖 Libro</button>
                <button class="tab" id="tabEx" onclick="showTab('ejercicios')">✏️ Ejercicios</button>
            </div>
        </div>

        <div class="view" id="viewBook">
        <div class="viewer" id="viewer">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Cargando página...</p>
            </div>
            <img id="pageImage" class="page-image" alt="Página del libro">
        </div>
        
        <div class="controls">
            <div class="nav-buttons">
                <button id="prevBtn" onclick="previousPage()">← Anterior</button>
                <button id="nextBtn" onclick="nextPage()">Siguiente →</button>
            </div>
            
            <div class="page-info">
                <span>Página <span id="currentPage">1</span> de <span id="totalPages">1</span></span>
                <input type="range" id="pageSlider" class="page-slider" min="1" max="1" value="1"
                       oninput="goToPage(this.value)">
            </div>
            
            <div class="zoom-buttons">
                <div class="mini-buttons">
                    <button onclick="zoomOut()" id="zoomOutBtn">−</button>
                    <span class="zoom-display" id="zoomDisplay">100%</span>
                    <button onclick="zoomIn()" id="zoomInBtn">+</button>
                </div>
                <button onclick="resetZoom()" style="padding: 6px 12px; font-size: 12px;">Restablecer</button>
            </div>
        </div>
        </div>

        <div class="view" id="viewEx" hidden>
            <div class="ex-wrap" id="exWrap">
                <div class="ex-inner">
                    <div class="lessons" id="lessonChips"></div>
                    <div id="lessonBody"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== LISTA DE PÁGINAS =====
        // Para añadir una página: sube la foto a la carpeta "pages/" y añade una línea aquí.
        const PAGES = [
            { file: 'portada.jpg', label: 'Portada' },
            { file: 'sb-056.jpg', label: 'Student Book p. 56 · 7A' },
            { file: 'sb-057.jpg', label: 'Student Book p. 57 · 7A' },
            { file: 'sb-058.jpg', label: 'Student Book p. 58 · 7B' },
            { file: 'sb-059.jpg', label: 'Student Book p. 59 · 7B' },
            { file: 'sb-060.jpg', label: 'Student Book p. 60 · 7C' },
        ];

        let currentPage = 1;
        const totalPages = PAGES.length;
        let currentZoom = 100;
        const zoomStep = 10;
        const minZoom = 50;
        const maxZoom = 300;
        
        const pageImage = document.getElementById('pageImage');
        const loading = document.getElementById('loading');
        const currentPageSpan = document.getElementById('currentPage');
        const pageSlider = document.getElementById('pageSlider');
        const zoomDisplay = document.getElementById('zoomDisplay');
        
        function getImagePath(page) {
            return 'pages/' + PAGES[page - 1].file;
        }

        document.getElementById('totalPages').textContent = totalPages;
        pageSlider.max = totalPages;
        
        function loadPage(page) {
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            currentPageSpan.textContent = page + (PAGES[page - 1].label ? ' · ' + PAGES[page - 1].label : '');
            pageSlider.value = page;
            
            loading.style.display = 'flex';
            pageImage.style.display = 'none';
            
            const img = new Image();
            img.onload = () => {
                pageImage.src = img.src;
                pageImage.style.display = 'block';
                loading.style.display = 'none';
                resetZoom();
                updateButtonStates();
            };
            img.onerror = () => {
                loading.innerHTML = '<p style="color: #d32f2f;">Error cargando la página</p>';
            };
            img.src = getImagePath(page);
        }
        
        function previousPage() {
            if (currentPage > 1) loadPage(currentPage - 1);
        }
        
        function nextPage() {
            if (currentPage < totalPages) loadPage(currentPage + 1);
        }
        
        function goToPage(page) {
            loadPage(parseInt(page));
        }
        
        function updateZoom() {
            pageImage.style.transform = `scale(${currentZoom / 100})`;
            zoomDisplay.textContent = currentZoom + '%';
        }
        
        function zoomIn() {
            if (currentZoom < maxZoom) {
                currentZoom += zoomStep;
                updateZoom();
            }
        }
        
        function zoomOut() {
            if (currentZoom > minZoom) {
                currentZoom -= zoomStep;
                updateZoom();
            }
        }
        
        function resetZoom() {
            currentZoom = 100;
            updateZoom();
        }
        
        function updateButtonStates() {
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }
        
        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('viewEx').hidden) return;
            if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') previousPage();
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === '+' || e.key === '=') zoomIn();
            if (e.key === '-') zoomOut();
            if (e.key === '0') resetZoom();
        });
        
        // Inicializar
        loadPage(1);
    </script>
    <script>
        // ===== EJERCICIOS =====
        // Tipos: 'choice' (botones), 'gap' (escribir; ___ marca el hueco), 'stress' (tocar la sílaba fuerte).
        // 'say' = texto que se lee en voz alta (inglés británico) con el botón 🔊.
        const sh = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
        const teenTy = () => sh([13,14,15,16,17,18,19]).map(n => {
            const v = Math.random() < .5 ? n : (n - 10) * 10;
            return { q: '', say: String(v), a: String(v), opts: [String(n), String((n - 10) * 10)] };
        });
        const V1 = ['fish /ɪ/', 'tree /iː/', 'cat /æ/', 'egg /e/', 'train /eɪ/', 'bike /aɪ/'];
        const V2 = ['fish /ɪ/', 'tree /iː/', 'cat /æ/', 'car /ɑː/', 'clock /ɒ/', 'horse /ɔː/', 'bull /ʊ/', 'boot /uː/'];
        const words = (list, opts) => list.map(([w, i]) => ({ q: w, say: w.replace(/^the /, ''), a: opts[i] }));

        const LESSONS = [
        { id: '1A', title: 'Hello, everybody', pages: 'pp. 8–9', ex: [
            { title: 'Saludos', instr: 'Elige la palabra que significa lo mismo.', type: 'choice',
              opts: ['Hi', "I'm...", 'Good', 'Thanks', 'Bye'],
              items: [['Hello =', 'Hi'], ["My name's... =", "I'm..."], ['Fine =', 'Good'], ['Thank you =', 'Thanks'], ['Goodbye =', 'Bye']].map(([q, a]) => ({ q, a })) },
            { title: 'Verb be: contracciones', instr: "Completa con 'm, 's o 're.", type: 'gap',
              items: [
                ['I am Dan. = I___ Dan.', ["'m"]], ['My name is Ed. = My name___ Ed.', ["'s"]],
                ['You are my partner. = You___ my partner.', ["'re"]], ['She is in my salsa class. = She___ in my salsa class.', ["'s"]],
                ['He is my teacher. = He___ my teacher.', ["'s"]], ['We are in the class. = We___ in the class.', ["'re"]],
                ['It is Monday. = It___ Monday.', ["'s"]], ['They are my friends. = They___ my friends.', ["'re"]],
              ].map(([t, a]) => ({ t, a })) },
            { title: 'Sonidos vocálicos', instr: 'Pulsa 🔊 para oír la palabra y elige su sonido.', type: 'choice', shuffle: true, opts: V1,
              items: words([['it',0],['this',0],['in',0],['he',1],['we',1],['meet',1],['am',2],['thanks',2],['Dan',2],['Ed',3],['yes',3],['welcome',3],['they',4],['name',4],['later',4],['Hi',5],['I',5],['Bye',5]], V1) },
            { title: 'Word stress', instr: 'Toca la sílaba acentuada (la que suena más fuerte).', type: 'stress', shuffle: true,
              items: [['air|port',0],['com|pu|ter',1],['e|mail',0],['ho|tel',1],['in|ter|net',0],['mu|se|um',1],['pas|ta',0],['piz|za',0],['sal|ad',0],['sand|wich',0],['u|ni|ver|si|ty',2],['web|site',0],['good|bye',1],['so|rry',0],['wel|come',0]].map(([w, a]) => ({ s: w.split('|'), a })) },
            { title: 'Food, technology o places', instr: '¿En qué columna va cada palabra?', type: 'choice', shuffle: true,
              opts: ['🍝 Food', '💻 Technology', '🏛️ Places'],
              items: [['pasta',0],['pizza',0],['salad',0],['sandwich',0],['computer',1],['email',1],['internet',1],['website',1],['airport',2],['hotel',2],['museum',2],['university',2]].map(([q, i]) => ({ q, say: q, a: ['🍝 Food', '💻 Technology', '🏛️ Places'][i] })) },
            { title: 'Days of the week', instr: 'Escribe el día siguiente.', type: 'gap',
              items: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((d, i, arr) => ({ t: d + ' → ___', a: [arr[(i + 1) % 7]] })) },
            { title: 'Numbers 0–20', instr: 'Escribe el número en letras.', type: 'gap',
              items: [[0,'zero'],[3,'three'],[8,'eight'],[11,'eleven'],[12,'twelve'],[13,'thirteen'],[15,'fifteen'],[18,'eighteen'],[20,'twenty']].map(([n, w]) => ({ t: n + ' = ___', a: [w] })) },
        ]},
        { id: '1B', title: 'A world of sport', pages: 'pp. 10–11', ex: [
            { title: 'Continents', instr: '¿En qué continente está cada país?', type: 'choice',
              opts: ['Africa', 'Asia', 'Europe', 'North America', 'South America'],
              items: [['the USA','North America'],['Egypt','Africa'],['China','Asia'],['the Czech Republic','Europe'],['Brazil','South America'],['Japan','Asia'],['Argentina','South America']].map(([q, a]) => ({ q, say: q, a })) },
            { title: 'Countries in English', instr: 'Escribe el país en inglés.', type: 'gap', noArticle: true,
              items: [['Deutschland','Germany'],['España','Spain'],['Éire','Ireland'],['Polska','Poland'],['La Suisse','Switzerland'],['Magyarország','Hungary']].map(([c, a]) => ({ t: c + ' → ___', a: [a] })) },
            { title: 'Nationalities', instr: 'Escribe la nacionalidad (como Scotland → Scottish).', type: 'gap',
              items: [['Spain','Spanish'],['Brazil','Brazilian'],['Italy','Italian'],['Mexico','Mexican'],['France','French'],['Egypt','Egyptian'],['England','English'],['Germany','German'],['Japan','Japanese'],['China','Chinese'],['Ireland','Irish'],['the USA','American'],['Turkey','Turkish'],['Russia','Russian'],['Argentina','Argentinian','Argentine'],['Poland','Polish'],['Switzerland','Swiss'],['Hungary','Hungarian']].map(([c, ...a]) => ({ t: c + ' → ___', a })) },
            { title: 'Consonant sounds', instr: 'Pulsa 🔊 y elige el sonido marcado.', type: 'choice', shuffle: true,
              opts: ['chess /tʃ/', 'shower /ʃ/', 'jazz /dʒ/'],
              items: [['Charles',0],['Czech',0],['French',0],['she',1],['English',1],['Irish',1],['German',2],['Japanese',2],['Nigeria',2]].map(([q, i]) => ({ q, say: q, a: ['chess /tʃ/', 'shower /ʃ/', 'jazz /dʒ/'][i] })) },
            { title: 'Verb be: negativas y preguntas', instr: '(−) = negativa, (?) = pregunta.', type: 'gap',
              items: [
                ["I'm Spanish. (−) ___ Spanish.", ["I'm not", 'I am not']],
                ["You're from Sydney. (−) You ___ from Sydney.", ["aren't", 'are not']],
                ["It's near Sydney. (−) It ___ near Sydney.", ["isn't", 'is not']],
                ["We're English. (−) We ___ English.", ["aren't", 'are not']],
                ["She's Italian. (?) ___ Italian?", ['Is she']],
                ["You're from Brazil. (?) ___ from Brazil?", ['Are you']],
                ["They're French. (?) ___ French?", ['Are they']],
                ["He's from Cairns. (?) ___ from Cairns?", ['Is he']],
              ].map(([t, a]) => ({ t, a })) },
            { title: 'Short answers', instr: 'Elige la respuesta correcta.', type: 'choice',
              items: [
                ['Is Sydney the capital of Australia?', ["Yes, it is.", "No, it isn't."], 1],
                ['Is Madrid the capital of Spain?', ["Yes, it is.", "No, it isn't."], 0],
                ['Is Oviedo in Italy?', ["Yes, it is.", "No, it isn't."], 1],
                ['Are you a student? (sí)', ["Yes, I am.", "Yes, I'm."], 0],
                ['Are Brazil and Argentina in Europe?', ["Yes, they are.", "No, they aren't."], 1],
                ['Is she from Mexico? (no)', ["No, she isn't.", "No, she not."], 0],
              ].map(([q, opts, i]) => ({ q, opts, a: opts[i] })) },
            { title: 'Numbers 21–100', instr: 'Escribe el número en letras.', type: 'gap',
              items: [[21,'twenty-one'],[33,'thirty-three'],[47,'forty-seven'],[58,'fifty-eight'],[64,'sixty-four'],[72,'seventy-two'],[86,'eighty-six'],[99,'ninety-nine'],[100,'a hundred','one hundred']].map(([n, ...a]) => ({ t: n + ' = ___', a })) },
            { title: '-teen o -ty', instr: 'Pulsa 🔊 y elige el número que oyes.', type: 'choice', items: teenTy },
        ]},
        { id: '1C', title: 'Open your books', pages: 'pp. 12–13', ex: [
            { title: 'Classroom', instr: 'Escribe la palabra en inglés.', type: 'gap', noArticle: true,
              items: [['pizarra','board'],['silla','chair'],['ordenador','computer'],['escritorio','desk'],['puerta','door'],['cuadro / imagen','picture'],['pantalla','screen'],['mesa','table'],['pared','wall'],['ventana','window']].map(([es, a]) => ({ t: es + ' → ___', a: [a] })) },
            { title: 'The alphabet', instr: 'Pulsa 🔊 y elige el sonido de cada letra.', type: 'choice', shuffle: true,
              opts: ['train /eɪ/', 'tree /iː/', 'egg /e/', 'bike /aɪ/', 'phone /əʊ/', 'boot /uː/', 'car /ɑː/'],
              items: [['A',0],['H',0],['J',0],['K',0],['B',1],['C',1],['D',1],['E',1],['G',1],['V',1],['F',2],['L',2],['M',2],['N',2],['S',2],['X',2],['Z',2],['I',3],['Y',3],['O',4],['Q',5],['U',5],['W',5],['R',6]].map(([q, i]) => ({ q, say: q, a: ['train /eɪ/', 'tree /iː/', 'egg /e/', 'bike /aɪ/', 'phone /əʊ/', 'boot /uː/', 'car /ɑː/'][i] })) },
            { title: '/əʊ/, /uː/, /ɑː/', instr: 'Pulsa 🔊 y elige el sonido.', type: 'choice', shuffle: true,
              opts: ['phone /əʊ/', 'boot /uː/', 'car /ɑː/'],
              items: [['close',0],['go',0],['Poland',0],['school',1],['do',1],['two',1],['class',2],['answer',2],['France',2]].map(([q, i]) => ({ q, say: q, a: ['phone /əʊ/', 'boot /uː/', 'car /ɑː/'][i] })) },
            { title: 'Spelling', instr: 'Pulsa 🔊: oirás una palabra deletreada. Escríbela.', type: 'gap',
              items: ['Fischer','Vazquez','Micaela','London','Harry','Oxford'].map(w => ({ t: '___', say: w.toUpperCase().split('').join(', '), a: [w] })) },
            { title: 'Abbreviations', instr: 'Escribe la abreviatura.', type: 'gap', noArticle: true,
              items: [['the United Kingdom','UK'],['the European Union','EU'],['a Very Important Person','VIP'],['the United States of America','USA'],['a Portable Document Format','PDF'],['a Chief Executive Officer','CEO'],['Estimated Time of Arrival','ETA'],['a Personal Assistant','PA']].map(([t, a]) => ({ t: t + ' → ___', a: [a] })) },
            { title: 'Questions', instr: 'Completa las preguntas del formulario.', type: 'gap',
              items: [['___ your first name?', ["What's", 'What is']], ['___ do you spell it?', ['How']], ['___ your surname?', ["What's", 'What is']], ['___ old are you?', ['How']], ['Where are you ___?', ['from']], ['___ your address?', ["What's", 'What is']], ['___ your postcode?', ["What's", 'What is']], ["What's your ___ address?", ['email', 'e-mail']], ["What's your phone ___?", ['number']]].map(([t, a]) => ({ t, a })) },
            { title: 'Possessive adjectives', instr: 'Elige la palabra correcta.', type: 'choice',
              items: [
                ['Where are ___ from?', ['I', 'you', 'my', 'your'], 'you'],
                ["___'m from Argentina.", ['I', 'you', 'my', 'your'], 'I'],
                ["What's ___ name?", ['I', 'you', 'my', 'your'], 'your'],
                ["___ name's Micaela.", ['I', 'you', 'my', 'your'], 'My'],
                ["He's Tom. ___ name's Tom.", ['his', 'her', 'its'], 'his'],
                ["She's Ana. ___ surname is López.", ['his', 'her', 'their'], 'her'],
                ["We're students. ___ teacher is Laura.", ['our', 'their', 'your'], 'our'],
                ["They're from Peru. ___ names are Ana and Luis.", ['our', 'their', 'his'], 'their'],
                ["It's a hotel. ___ name is The Ritz.", ['its', "it's", 'his'], 'its'],
              ].map(([q, opts, a]) => ({ q, opts: opts.map(o => q.startsWith('___') ? o[0].toUpperCase() + o.slice(1) : o), a })) },
        ]},
        { id: 'PE1', title: 'Practical English · A new city', pages: 'pp. 14–15', ex: [
            { title: 'In a hotel', instr: 'Escribe la palabra en inglés.', type: 'gap', noArticle: true,
              items: [['recepción',['reception']],['habitación individual',['single room']],['habitación doble',['double room']],['el bar',['bar']],['ascensor',['lift','elevator']],['planta baja',['ground floor']],['la llave',['key']],['el pasaporte',['passport']]].map(([es, a]) => ({ t: es + ' → ___', a })) },
            { title: 'Checking in', instr: 'Completa lo que dice el recepcionista.', type: 'gap',
              items: [['Can you ___ your surname, please?', ['spell']], ['Can I have your ___, please?', ['passport']], ["Here's your ___. It's room 12, on the second floor.", ['key']], ['The ___ is over there.', ['lift', 'elevator']], ['Would you like a ___ of London?', ['map']]].map(([t, a]) => ({ t, a })) },
            { title: 'Requests and offers', instr: 'Elige: Can you…? / Can I have…? / Would you like…?', type: 'choice',
              opts: ['Can you', 'Can I have', 'Would you like'],
              items: [['___ spell that?', 0], ['___ your passport, please?', 1], ['___ a map?', 2], ['___ sign here?', 0], ['___ my key, please?', 1], ['___ a coffee?', 2]].map(([q, i]) => ({ q, a: ['Can you', 'Can I have', 'Would you like'][i] })) },
            { title: 'Greetings', instr: '¿Qué saludo usas a esta hora?', type: 'choice', shuffle: true,
              opts: ['Good morning', 'Good afternoon', 'Good evening'],
              items: [['🕘 09:30', 0], ['🕚 11:00', 0], ['🕑 14:00', 1], ['🕔 17:00', 1], ['🕢 19:30', 2], ['🕘 21:00', 2]].map(([q, i]) => ({ q, a: ['Good morning', 'Good afternoon', 'Good evening'][i] })) },
            { title: 'Social English', instr: 'Elige la respuesta adecuada.', type: 'choice',
              opts: ['Sure.', 'Yes, I am.', "It's nice. I like it.", "No, I'm a student.", "You're welcome."],
              items: [['Can I take a photo?', 'Sure.'], ["You're American, right?", 'Yes, I am.'], ['What do you think of London?', "It's nice. I like it."], ['Are you on holiday?', "No, I'm a student."], ['Thank you.', "You're welcome."]].map(([q, a]) => ({ q, say: q, a })) },
        ]},
        { id: '2A', title: 'Your desk and you', pages: 'pp. 16–17', ex: [
            { title: 'Things', instr: 'Escribe la palabra en inglés.', type: 'gap', noArticle: true,
              items: [['bolígrafo','pen'],['llaves','keys'],['gafas','glasses'],['cartera','wallet'],['monedero','purse'],['paraguas','umbrella'],['reloj (de pulsera)','watch'],['agenda','diary'],['portátil','laptop'],['impresora','printer'],['lámpara','lamp'],['planta','plant'],['cuaderno','notebook'],['diccionario','dictionary'],['auriculares','headphones'],['pañuelos de papel','tissues']].map(([es, a]) => ({ t: es + ' → ___', a: [a] })) },
            { title: 'a o an', instr: 'an delante de sonido vocálico.', type: 'choice', shuffle: true, opts: ['a', 'an'],
              items: [['pen','a'],['umbrella','an'],['watch','a'],['email','an'],['diary','a'],['ID card','an'],['apple','an'],['key','a'],['orange','an'],['laptop','a'],['university','a'],['address','an']].map(([w, a]) => ({ q: '___ ' + w, say: w, a })) },
            { title: 'Plurals', instr: 'Escribe el plural.', type: 'gap',
              items: [['pen','pens'],['umbrella','umbrellas'],['watch','watches'],['diary','diaries'],['key','keys'],['box','boxes'],['glass','glasses'],['city','cities'],['dictionary','dictionaries'],['photo','photos'],['man','men'],['woman','women'],['person','people'],['child','children']].map(([s, p]) => ({ t: 'one ' + s + ' → two ___', a: [p] })) },
            { title: 'Final -s y -es', instr: 'Pulsa 🔊 y elige cómo suena el final.', type: 'choice', shuffle: true,
              opts: ['/s/ snake', '/z/ zebra', '/ɪz/'],
              items: [['books',0],['lamps',0],['tickets',0],['keys',1],['pens',1],['photos',1],['files',1],['headphones',1],['tissues',1],['phones',1],['glasses',2],['purses',2],['watches',2],['classes',2],['boxes',2],['pieces',2],['pages',2]].map(([q, i]) => ({ q, say: q, a: ['/s/ snake', '/z/ zebra', '/ɪz/'][i] })) },
            { title: 'in, on, under', instr: 'Elige la preposición.', type: 'choice', opts: ['in', 'on', 'under'],
              items: [['The glasses are ___ the notebook.','on'],['The cards are ___ the wallet.','in'],['The bag is ___ the desk.','under'],['My keys are ___ my bag.','in'],['The picture is ___ the wall.','on'],['The shoes are ___ the bed.','under'],['The phone is ___ my pocket.','in'],['The computer is ___ the desk.','on']].map(([q, a]) => ({ q, a })) },
        ]},
        { id: '2B', title: 'Made in the USA', pages: 'pp. 18–19', ex: [
            { title: 'Colours', instr: 'Escribe el color completo.', type: 'gap',
              items: [['r_d','red'],['wh_t_','white'],['bl_ _','blue'],['bl_ck','black'],['y_ll_w','yellow'],['gr_y','grey'],['_r_ng_','orange'],['br_wn','brown'],['p_nk','pink'],['gr_ _n','green'],['p_rpl_','purple'],['s_lv_r','silver'],['g_ld','gold']].map(([h, a]) => ({ t: h + ' → ___', a: [a] })) },
            { title: 'American icons', instr: 'Elige el nombre en inglés (adjetivo + nombre).', type: 'choice', shuffle: true,
              opts: ['American football', 'blue jeans', 'fast food', 'the High Line', 'the White House', 'French fries', 'yellow taxis', 'New York'],
              items: [['🏈 fútbol americano','American football'],['👖 vaqueros','blue jeans'],['🍔 comida rápida','fast food'],['🌿 parque elevado de Manhattan','the High Line'],['🏛️ casa del presidente','the White House'],['🍟 patatas fritas','French fries'],['🚕 taxis amarillos','yellow taxis'],['🗽 la Gran Manzana','New York']].map(([q, a]) => ({ q, a })) },
            { title: 'Adjectives', instr: 'El adjetivo va delante y no tiene plural.', type: 'choice',
              items: [
                ['Can I have ___, please?', ['French fries', 'fries French'], 0],
                ['In New York the taxis are ___.', ['yellows', 'yellow'], 1],
                ['I have a ___.', ['red car', 'car red'], 0],
                ['Taxis are really ___.', ['expensives', 'expensive'], 1],
                ['She has ___.', ['blue eyes', 'eyes blue'], 0],
                ['These are ___.', ['goods books', 'good books'], 1],
                ["It's a ___.", ['big house', 'house big'], 0],
              ].map(([q, opts, i]) => ({ q, opts, a: opts[i] })) },
            { title: 'Opposites', instr: 'Escribe el contrario.', type: 'gap',
              items: [['big',['small']],['cheap',['expensive']],['new',['old']],['good',['bad']],['hot',['cold']],['long',['short']],['fast',['slow']],['easy',['difficult']],['full',['empty']],['young',['old']]].map(([w, a]) => ({ t: w + ' ↔ ___', a })) },
            { title: 'Long and short vowels', instr: 'Pulsa 🔊 y elige el sonido.', type: 'choice', shuffle: true, opts: V2,
              items: words([['big',0],['city',0],['cheap',1],['jeans',1],['black',2],['bag',2],['dark',3],['glasses',3],['hot',4],['chocolate',4],['short',5],['story',5],['good',6],['book',6],['new',7],['boots',7]], V2) },
            { title: 'Mismo sonido', instr: 'Une cada adjetivo con el nombre que tiene su mismo sonido vocálico.', type: 'choice', shuffle: true,
              opts: ['city', 'bag', 'jeans', 'glasses', 'book', 'chocolate', 'boots', 'story'],
              items: [['big','city'],['black','bag'],['cheap','jeans'],['dark','glasses'],['good','book'],['hot','chocolate'],['new','boots'],['short','story']].map(([q, a]) => ({ q: 'a ' + q + ' ___', say: q, a })) },
            { title: 'British and American English', instr: '¿De qué tipo de diferencia se trata?', type: 'choice',
              opts: ['Vocabulary', 'Spelling', 'Grammar', 'Pronunciation'],
              items: [['zip code / postcode', 'Vocabulary'], ['color / colour', 'Spelling'], ['See you Friday / See you on Friday', 'Grammar'], ['the accents', 'Pronunciation'], ['elevator / lift', 'Vocabulary'], ['center / centre', 'Spelling']].map(([q, a]) => ({ q, a })) },
            { title: 'American → British', instr: 'Escribe la palabra en inglés británico.', type: 'gap', noArticle: true,
              items: [['zip code',['postcode']],['vacation',['holiday']],['elevator',['lift']],['color',['colour']],['center',['centre']],['theater',['theatre']],['favor',['favour']],['See you Friday. → See you ___ Friday.',['on']],['apartment',['flat']],['fries',['chips']],['cookie',['biscuit']],['subway',['underground','tube']],['cell phone',['mobile','mobile phone']],['movie',['film']],['pants',['trousers']],['gas',['petrol']],['candy',['sweets']]].map(([w, a]) => ({ t: w.includes('___') ? w : w + ' → ___', a })) },
        ]},
        ];

        // ===== MOTOR =====
        let BEST = {};
        try { BEST = JSON.parse(localStorage.getItem('efe-ex-best') || '{}'); } catch (e) {}
        const saveBest = () => { try { localStorage.setItem('efe-ex-best', JSON.stringify(BEST)); } catch (e) {} };
        let curLesson = '1A';
        try { curLesson = localStorage.getItem('efe-ex-lesson') || '1A'; } catch (e) {}
        if (!LESSONS.find(l => l.id === curLesson)) curLesson = '1A';

        let voice = null;
        function pickVoice() {
            try {
                const v = speechSynthesis.getVoices();
                voice = v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null;
            } catch (e) {}
        }
        try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
        function speak(t) {
            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-GB'; u.rate = 0.85; if (voice) u.voice = voice;
                speechSynthesis.speak(u);
            } catch (e) { alert('Tu navegador no puede leer en voz alta.'); }
        }

        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        function norm(s, noArt) {
            s = String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[-‐–]/g, ' ')
                .replace(/[.!?,]+$/, '').replace(/\s+/g, ' ').trim();
            if (noArt) s = s.replace(/^(a|an|the) /, '');
            return s;
        }
        const exKey = (l, i) => l.id + '-' + i;
        const sayBtn = t => `<button class="say" data-say="${esc(t)}" title="Escuchar">🔊</button>`;

        function renderChips() {
            document.getElementById('lessonChips').innerHTML = LESSONS.map(l => {
                const done = l.ex.filter((e, i) => BEST[exKey(l, i)] === 'full').length;
                return `<button class="lesson-chip ${l.id === curLesson ? 'active' : ''}" onclick="openLesson('${l.id}')">${l.id}<small>${done}/${l.ex.length}</small></button>`;
            }).join('');
        }

        function openLesson(id) {
            curLesson = id;
            try { localStorage.setItem('efe-ex-lesson', id); } catch (e) {}
            const l = LESSONS.find(x => x.id === id);
            const body = document.getElementById('lessonBody');
            body.innerHTML = `<h2 class="lesson-title">${l.id} · ${esc(l.title)}</h2><div class="lesson-sub">Student Book ${l.pages}</div>`;
            l.ex.forEach((ex, i) => { const c = document.createElement('div'); c.className = 'card'; body.appendChild(c); renderCard(c, l, i); });
            renderChips();
            document.getElementById('exWrap').scrollTop = 0;
        }

        function renderCard(card, lesson, idx) {
            const ex = lesson.ex[idx], key = exKey(lesson, idx);
            let items = typeof ex.items === 'function' ? ex.items() : ex.items.slice();
            if (ex.shuffle) items = sh(items);
            const st = { right: 0, answered: 0, n: items.length };
            const mark = BEST[key] === 'full' ? ' ✅' : '';
            let html = `<h3><span>${esc(ex.title)}${mark}</span><span class="score">0 / ${items.length}</span></h3><div class="instr">${esc(ex.instr)}</div>`;

            items.forEach((it, j) => {
                html += `<div class="item" data-j="${j}">`;
                if (ex.type === 'choice') {
                    const opts = it.opts || ex.opts;
                    html += (it.say ? sayBtn(it.say) : '') + (it.q ? `<span class="q">${esc(it.q)}</span>` : '<span class="q">Escucha…</span>');
                    html += `<div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
                } else if (ex.type === 'gap') {
                    const w = Math.max(70, Math.max(...it.a.map(a => a.length)) * 11 + 24);
                    const parts = it.t.split('___');
                    html += (it.say ? sayBtn(it.say) : '') + esc(parts[0]) +
                        `<input class="gap" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${w}px">` +
                        esc(parts[1] || '') + '<span class="fix"></span>';
                } else if (ex.type === 'stress') {
                    html += sayBtn(it.s.join('')) + `<span class="opts" style="display:inline-flex">${it.s.map((sy, k) => `<button class="opt syl" data-k="${k}">${esc(sy)}</button>`).join('')}</span>`;
                }
                html += '</div>';
            });

            html += '<div class="actions">';
            if (ex.type === 'gap') html += '<button class="chk">Comprobar</button><button class="sec sol">Ver soluciones</button>';
            html += '<button class="sec rst">Empezar de nuevo</button></div>';
            card.innerHTML = html;

            const scoreEl = card.querySelector('.score');
            const update = () => {
                scoreEl.textContent = `${st.right} / ${st.n}`;
                const finished = st.answered === st.n;
                scoreEl.classList.toggle('done', finished && st.right === st.n);
                if (finished) {
                    const prev = BEST[key];
                    if (st.right === st.n) BEST[key] = 'full';
                    else if (prev !== 'full') BEST[key] = 'part';
                    if (BEST[key] !== prev) { saveBest(); renderChips(); }
                }
            };

            card.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
            card.querySelector('.rst').onclick = () => renderCard(card, lesson, idx);

            if (ex.type === 'choice' || ex.type === 'stress') {
                card.querySelectorAll('.item').forEach(row => {
                    const it = items[+row.dataset.j];
                    const btns = row.querySelectorAll('.opt');
                    btns.forEach(b => b.onclick = () => {
                        const ok = ex.type === 'stress' ? +b.dataset.k === it.a : b.dataset.o === it.a;
                        btns.forEach(x => {
                            x.disabled = true;
                            const good = ex.type === 'stress' ? +x.dataset.k === it.a : x.dataset.o === it.a;
                            if (good) x.classList.add('ok');
                        });
                        if (!ok) b.classList.add('bad');
                        if (ex.type === 'stress') speak(it.s.join(''));
                        if (it.say && !it.q) { const q = row.querySelector('.q'); q.textContent = it.say; }
                        st.answered++; if (ok) st.right++;
                        update();
                    });
                });
            } else {
                const inputs = [...card.querySelectorAll('.gap')];
                const check = () => {
                    st.right = 0; st.answered = st.n;
                    inputs.forEach((inp, j) => {
                        const ok = items[j].a.some(a => norm(a, ex.noArticle) === norm(inp.value, ex.noArticle));
                        inp.classList.toggle('ok', ok); inp.classList.toggle('bad', !ok);
                        if (ok) { st.right++; inp.nextElementSibling && (inp.parentElement.querySelector('.fix').textContent = ''); }
                    });
                    update();
                };
                card.querySelector('.chk').onclick = check;
                card.querySelector('.sol').onclick = () => {
                    inputs.forEach((inp, j) => {
                        const ok = items[j].a.some(a => norm(a, ex.noArticle) === norm(inp.value, ex.noArticle));
                        if (!ok) { inp.classList.add('bad'); inp.parentElement.querySelector('.fix').textContent = '→ ' + items[j].a.join(' / '); }
                        else inp.classList.add('ok');
                    });
                };
                inputs.forEach((inp, j) => inp.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); (inputs[j + 1] || inp).focus(); if (!inputs[j + 1]) check(); }
                }));
            }
        }

        // ===== PESTAÑAS =====
        let exReady = false;
        function showTab(t) {
            const ex = t === 'ejercicios';
            document.getElementById('viewBook').hidden = ex;
            document.getElementById('viewEx').hidden = !ex;
            document.getElementById('tabBook').classList.toggle('active', !ex);
            document.getElementById('tabEx').classList.toggle('active', ex);
            if (ex && !exReady) { exReady = true; openLesson(curLesson); }
            try { history.replaceState(null, '', ex ? '#ejercicios' : '#'); } catch (e) {}
        }
        if (location.hash === '#ejercicios') showTab('ejercicios');
    </script>
</body>
